# ─────────────────────────────────────────────────────────────
# refine_phase_a.yaml — Phase A refinement (service cost regressor)
# ─────────────────────────────────────────────────────────────
# This config drives scripts/refine_predictors.py. It re-runs the two
# strongest baseline families (RandomForest and HistGradientBoosting)
# with RandomizedSearchCV + GroupKFold-by-query_id, then selects the
# best refined model per the configured primary metric.
#
# Rationale for refining RF/GB only:
#   * The baseline battery (results/baseline_comparison/SUMMARY_FOR_MEMORIA.md)
#     shows RF and HistGB dominate every regression metric on the
#     held-out test split. Linear/Ridge/Lasso were nearly an order of
#     magnitude worse on MAE, and MLP did not improve over GB despite
#     ~5× the training time.
#   * Searching on every family in this stage would dilute the
#     compute budget without changing the ordering, so we focus on
#     the only two families that actually have a chance of winning.
#
# Splits and seed must match the baseline run so the comparison is fair.
# ─────────────────────────────────────────────────────────────

output_root: "results/phase_a/predictors_refined"

# We minimise MAE on the held-out test split. MAE is in seconds, easy to
# read in the memoria, and is what the routing controller will actually
# consume (it sets latency-aware thresholds in real units).
primary_metric: "test_mae"
primary_metric_direction: "min"

predictors:
  - id: "service_cost"
    task: "regression"
    dataset_jsonl: "results/phase_a/datasets/service_cost_phase_a.jsonl"
    dataset_meta_json: "results/phase_a/datasets/service_cost_phase_a_meta.json"
    target_column: "target_service_cost"
    seed: 42
    train_ratio: 0.70
    val_ratio: 0.15
    # 30 trials × 3 CV folds per family is a sweet spot:
    # large enough to actually move beyond the baseline,
    # small enough to fit a single GPU-less SLURM node.
    n_iter: 30
    n_splits: 3
    # neg_MAE matches the primary metric so the search picks the
    # estimator that minimises MAE on validation folds.
    scoring: "neg_mean_absolute_error"
    families:
      - random_forest
      - gradient_boosting
    # Search spaces are deliberately modest. They mix:
    #   * "complex" combinations (deep trees, many estimators) for accuracy
    #   * "simple" combinations (shallow / few estimators) so the search
    #     can return a faster, lighter model if it nearly matches the
    #     deep one — this is the "model simplification" lever.
    search_space:
      random_forest:
        n_estimators: [100, 200, 400, 800]
        max_depth: [null, 10, 20, 40]
        min_samples_leaf: [1, 2, 5, 10]
        max_features: ["sqrt", 0.5, 0.8, 1.0]
      gradient_boosting:
        learning_rate: [0.03, 0.05, 0.1]
        max_iter: [200, 400, 800]
        max_depth: [null, 6, 8, 12]
        max_leaf_nodes: [15, 31, 63]
        l2_regularization: [0.0, 1.0e-4, 1.0e-2]
