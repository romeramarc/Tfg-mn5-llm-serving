# ─────────────────────────────────────────────────────────────
# Holdout fase 2 — λ operativo + 1.5B base vs destilado + baseline B
# ─────────────────────────────────────────────────────────────
#
# Punto λ elegido: 1e-4 (sysE_l1e4), tras el barrido routing_real:
#   - λ=0     → máxima calidad, mucho 7B/3B (acc_scorable ~90%)
#   - λ=5e-5  → intermedio-alto (~87%)
#   - λ=1e-4  → equilibrio: mezcla 1.5B/3B, acc ~85%, no saturado en 1.5B
#   - λ=5e-4  → casi siempre 1.5B (~85%, poco routing útil)
#
# Comparación destilado vs base (mismo λ, mismos predictores):
#   - Destilado: YA en results/routing_eval_holdout_v2_routing_real/
#                sysE_l1e4-routing_plus_cascade-*  (NO relanzar)
#   - Base:      sysE_l1e4_no_distill (esta ola; student_small = 1.5B instruct)
#
# Baseline B (suelo 1.5B, sin routing):
#   - sysB_only_1p5b → always_student_small, solo GPU student_small (base)
#   - Distinto del sysB_only_tiny (0.5B) del holdout v1.
#
# BSC (ola separada; NO en paralelo con servidores destilados):
#   export PROJECT_DIR=$PWD
#   bash slurm/submit_holdout_phase2.sh
# ─────────────────────────────────────────────────────────────

common:
  seed: 42
  results_base_dir: "results/routing_eval_holdout_v2_phase2"

execution_plan:
  one_job_per_system: true
  shared_prompt_pool: "results/routing_eval_holdout/prompt_pool.jsonl"
  endpoint_dir: "results/routing/endpoints"
  endpoint_wait_s: 1200
  # Cliente debe pedir 1.5B base en student_small, no el destilado.
  # routing/endpoints.resolve_endpoints lee este fichero para el nombre del modelo.
  models_config: "configs/models_no_distill.yaml"

systems:
  - id: "sysB_only_1p5b"
    policy: "always_student_small"
    roles: ["student_small"]
    models_config: "configs/models_no_distill.yaml"

  - id: "sysE_l1e4_no_distill"
    policy: "routing_plus_cascade"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    models_config: "configs/models_no_distill.yaml"
    policy_overrides:
      routing_plus_cascade:
        cost_weight_lambda: 0.0001

benchmarks:
  gsm8k_holdout:
    enabled: true
    benchmark_label: "gsm8k"
    dataset_name: "openai/gsm8k"
    dataset_config: "main"
    dataset_split: "test"
    min_example_id: 250
    subset_size: 300
    prompt_template: |
      Solve the following math problem step by step.
      Put your final numeric answer after ####.

      Question: {question}

      Answer:
    answer_extraction_pattern: "####\\s*([\\-\\d,\\.]+)"

  hendrycks_math_holdout:
    enabled: true
    benchmark_label: "math"
    dataset_name: "EleutherAI/hendrycks_math"
    dataset_subjects:
      - algebra
      - counting_and_probability
      - geometry
      - intermediate_algebra
      - number_theory
      - prealgebra
      - precalculus
    dataset_split: "train"
    subset_size: 300
    prompt_template: |
      Solve the following mathematics problem.
      Put your final answer inside \\boxed{{}}.

      Problem: {problem}

      Solution:
    answer_extraction_pattern: "\\\\boxed\\{([^}]+)\\}"

workload:
  arrival_rates_rps: [5]
  num_warmup_requests: 15
  max_inflight: 48
  shuffle_per_rate: true
  max_tokens: 512
  temperature: 0.0
  request_timeout_s: 180.0
  logprobs_top_k: 5
  stream: false
  samplers:
    server_metrics:
      enabled: true
      interval_s: 0.25
    gpu_smi:
      enabled: true
      interval_s: 0.2

predictors:
  cost_policy: strict_ex_ante
  bundles:
    quality_ex_ante: "results/predictors_model_tier/phase_b/refined-qea-rf-20260521T140929Z/model_bundle.joblib"
    quality_post_hoc: "results/predictors_model_tier/phase_b/refined-qph-rf-20260521T141032Z/model_bundle.joblib"
    service_cost: "results/predictors_model_tier/phase_a/refined-sc-rf-20260521T140842Z/model_bundle.joblib"
  thresholds:
    quality_ex_ante: 0.6226785631261728
    quality_post_hoc: 0.7727837620033459
  source:
    phase_a_selection: "results/predictors_model_tier/phase_a/REFINEMENT_SELECTION.json"
    phase_b_selection: "results/predictors_model_tier/phase_b/REFINEMENT_SELECTION.json"
    requires_model_tier_feature: true

policy_params:
  routing_predictive:
    routing_selection: max_utility
    min_quality_floor: 0.55
    candidate_rungs: ["student_small", "student_q3b", "student_mid", "teacher"]
    cost_weight_lambda: 0.0001
  cascade_five_rung:
    rung_order: ["student_small", "student_q3b", "student_mid", "teacher"]
    post_hoc_threshold: 0.7727837620033459
    per_rung_timeout_ms: [4000, 6000, 8000, 120000]
  routing_plus_cascade:
    routing_selection: max_utility
    min_quality_floor: 0.55
    routing_candidates: ["student_small", "student_q3b", "student_mid"]
    rung_order: ["student_small", "student_q3b", "student_mid", "teacher"]
    post_hoc_threshold: 0.7727837620033459
    per_rung_timeout_ms: [4000, 6000, 8000, 120000]
    cost_weight_lambda: 0.0001

output:
  per_request_jsonl: "per_request.jsonl"
  summary_json: "summary.json"
