# ─────────────────────────────────────────────────────────────
# routing_eval_holdout_v2.yaml — Holdout v2 (definitivo)
# ─────────────────────────────────────────────────────────────
# Diseño factorial simétrico (opción A):
#
#   • Escalera 4 rungs (sin 0.5B): 1.5B distilled → 3B → 7B → 14B teacher
#   • Sweep λ idéntico en routing (C) y routing+cascada (E): 0.010, 0.025, 0.050, 0.100
#   • Cascada pura (D) sin λ — control fijo de política
#   • Baselines v1 NO relanzados: sysA_only_teacher, sysB_only_tiny (20260520)
#
# Comparaciones defendibles en memoria:
#   1) Mismo λ: sysC_l* vs sysE_l*  → efecto de la cascada
#   2) Frente Pareto C* vs E* vs D4 vs A/B
#   3) Mix del 1.5B distilled sin que 0.5B opaque el routing
#
# NO lanzar este template sin reentreno: usar
#   configs/routing_eval_holdout_v2_retrained.yaml
# (generado por slurm/retrain_predictors_model_tier.sbatch)
#
# BSC — secuencia completa:
#   git pull
#   sbatch slurm/retrain_predictors_model_tier.sbatch
#   # tras OK:
#   python scripts/preflight_eval_holdout.py --config configs/routing_eval_holdout_v2_retrained.yaml
#   EVAL_CONFIG=configs/routing_eval_holdout_v2_retrained.yaml \
#   PROMPT_POOL=results/routing_eval_holdout/prompt_pool.jsonl \
#   bash slurm/launch_eval_holdout.sh all
#
# 9 eval jobs: 4×C + 1×D + 4×E  |  4 servers (small, q3b, mid, teacher)
# ─────────────────────────────────────────────────────────────

common:
  seed: 42
  results_base_dir: "results/routing_eval_holdout_v2"

execution_plan:
  one_job_per_system: true
  shared_prompt_pool: "results/routing_eval_holdout/prompt_pool.jsonl"
  endpoint_dir: "results/routing/endpoints"
  endpoint_wait_s: 1200

systems:
  # ── Routing only: sweep λ (misma rejilla que E) ───────────────────────────
  - id: "sysC_l010"
    policy: "routing_predictive"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_predictive:
        cost_weight_lambda: 0.010

  - id: "sysC_l025"
    policy: "routing_predictive"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_predictive:
        cost_weight_lambda: 0.025

  - id: "sysC_l050"
    policy: "routing_predictive"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_predictive:
        cost_weight_lambda: 0.050

  - id: "sysC_l100"
    policy: "routing_predictive"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_predictive:
        cost_weight_lambda: 0.100

  # ── Cascade only (sin λ) ──────────────────────────────────────────────────
  - id: "sysD_cascade4"
    policy: "cascade_five_rung"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]

  # ── Routing + cascade: mismo sweep λ que C ────────────────────────────────
  - id: "sysE_l010"
    policy: "routing_plus_cascade"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_plus_cascade:
        cost_weight_lambda: 0.010

  - id: "sysE_l025"
    policy: "routing_plus_cascade"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_plus_cascade:
        cost_weight_lambda: 0.025

  - id: "sysE_l050"
    policy: "routing_plus_cascade"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_plus_cascade:
        cost_weight_lambda: 0.050

  - id: "sysE_l100"
    policy: "routing_plus_cascade"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_plus_cascade:
        cost_weight_lambda: 0.100

benchmarks:
  gsm8k_holdout:
    enabled: true
    benchmark_label: "gsm8k"
    dataset_name: "openai/gsm8k"
    dataset_config: "main"
    dataset_split: "test"
    min_example_id: 250
    subset_size: 300
    prompt_template: |
      Solve the following math problem step by step.
      Put your final numeric answer after ####.

      Question: {question}

      Answer:
    answer_extraction_pattern: "####\\s*([\\-\\d,\\.]+)"

  hendrycks_math_holdout:
    enabled: true
    benchmark_label: "math"
    dataset_name: "EleutherAI/hendrycks_math"
    dataset_subjects:
      - algebra
      - counting_and_probability
      - geometry
      - intermediate_algebra
      - number_theory
      - prealgebra
      - precalculus
    dataset_split: "train"
    subset_size: 300
    prompt_template: |
      Solve the following mathematics problem.
      Put your final answer inside \\boxed{{}}.

      Problem: {problem}

      Solution:
    answer_extraction_pattern: "\\\\boxed\\{([^}]+)\\}"

workload:
  arrival_rates_rps: [5]
  num_warmup_requests: 15
  max_inflight: 48
  shuffle_per_rate: true
  max_tokens: 512
  temperature: 0.0
  request_timeout_s: 180.0
  logprobs_top_k: 5
  stream: false
  samplers:
    server_metrics:
      enabled: true
      interval_s: 0.25
    gpu_smi:
      enabled: true
      interval_s: 0.2

predictors:
  cost_policy: "strict_ex_ante"
  bundles:
    quality_ex_ante: "results/phase_b/predictors_refined/refined-qea-rf-20260515T014429Z/model_bundle.joblib"
    quality_post_hoc: "results/phase_b/predictors_refined/refined-qph-rf-20260515T014517Z/model_bundle.joblib"
    service_cost: "results/phase_a/predictors_refined/refined-sc-rf-20260515T014348Z/model_bundle.joblib"
  thresholds:
    quality_ex_ante: 0.632
    quality_post_hoc: 0.716

# U(rung) = Q̂_ex_ante(prompt, z, rung) - λ·Ĉ_servicio(prompt, z, rung).
# λ por sistema solo vía policy_overrides (C_* y E_*). Default 0.025 = fallback interno.
# Bundles finales: routing_eval_holdout_v2_retrained.yaml (model_tier en features).

policy_params:
  routing_predictive:
    routing_selection: max_utility
    min_quality_floor: 0.55
    candidate_rungs: ["student_small", "student_q3b", "student_mid", "teacher"]
    cost_weight_lambda: 0.025
  cascade_five_rung:
    rung_order: ["student_small", "student_q3b", "student_mid", "teacher"]
    post_hoc_threshold: 0.716
    per_rung_timeout_ms: [4000, 6000, 8000, 120000]
  routing_plus_cascade:
    routing_selection: max_utility
    min_quality_floor: 0.55
    routing_candidates: ["student_small", "student_q3b", "student_mid"]
    rung_order: ["student_small", "student_q3b", "student_mid", "teacher"]
    post_hoc_threshold: 0.716
    per_rung_timeout_ms: [4000, 6000, 8000, 120000]
    cost_weight_lambda: 0.025

output:
  per_request_jsonl: "per_request.jsonl"
  summary_json: "summary.json"
