# ─────────────────────────────────────────────────────────────
# routing.yaml — Routing policy configuration
# ─────────────────────────────────────────────────────────────

endpoints:
  teacher:
    base_url: "http://localhost:8000"
    model: "Qwen/Qwen2.5-14B-Instruct"
  student:
    base_url: "http://localhost:8001"
    model: "Qwen/Qwen2.5-7B-Instruct"
  student_mid:
    base_url: "http://localhost:8001"
    model: "Qwen/Qwen2.5-7B-Instruct"
  student_small:
    base_url: "http://localhost:8002"
    model: "Qwen/Qwen2.5-1.5B-Instruct"

# Active policy: always_teacher | cascading | confidence | cascade_three_tier
active_policy: "confidence"

policies:
  always_teacher:
    description: "Route every request to the teacher model."

  cascading:
    description: >
      Try the student first.  If latency exceeds the budget or
      the student returns an error, escalate to the teacher.
    student_timeout_ms: 3000
    max_student_retries: 0

  confidence:
    description: >
      Query the student with logprobs.  If the estimated
      confidence falls below the threshold, re-query
      the teacher.
    logprobs_top_k: 5
    confidence_threshold: 0.70
    fallback_method: "entropy"   # entropy | max_logprob

  cascade_three_tier:
    description: >
      Fixed cascade for phase 2: student_small (1.5B) ->
      student_mid (7B) -> teacher (14B).  Each student stage
      can accept the response based on confidence thresholds.
    logprobs_top_k: 5
    fallback_method: "entropy"   # entropy | max_logprob
    small_confidence_threshold: 0.45
    mid_confidence_threshold: 0.60
    small_timeout_ms: 2500
    mid_timeout_ms: 4000
    teacher_timeout_ms: 120000

experiment:
  prompts_file: "configs/prompts.jsonl"
  num_requests: 200
  concurrency: 16
  max_tokens: 256
  temperature: 0.0
  seed: 42
  results_dir: "results/routing"
