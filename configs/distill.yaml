# ─────────────────────────────────────────────────────────────
# distill.yaml — Knowledge distillation configuration
# ─────────────────────────────────────────────────────────────
# Phase 2: hard-label black-box distillation.
#   Step 1  generate_teacher_outputs.py  →  teacher_outputs.jsonl
#   Step 2  train_student_sft.py         →  LoRA adapter
#
# Experiment 4 (launch: slurm/launch_distill_v4.sh):
#   - 7B: GSM8K-first (oversample gsm8k×2), gentler LR, smaller LoRA — reduce
#     GSM8K regression vs teacher reference.
#   - 1.5B: stronger LoRA, 5 ep, oversample gsm8k+math×2, gradient clipping
#     — push GSM8K and MATH vs previous post-KD.
#   - Training: oversample_benchmarks + max_grad_norm in train_student_sft.py
# ─────────────────────────────────────────────────────────────

# ── KD benchmark prompts (TRAIN splits — no test-set leakage) ──
# These are used ONLY for generating the KD dataset.
# Evaluation uses eval.yaml which points to the TEST splits.
benchmarks:
  gsm8k:
    enabled: true
    dataset_name: "openai/gsm8k"
    dataset_split: "train"               # 7 473 items (train split)
    subset_size: null
    prompt_template: |
      Solve the following math problem step by step.
      Put your final numeric answer after ####.

      Question: {question}

      Answer:

  math:
    enabled: true                        # hendrycks/competition_math (7 subjects, ~7 500 train items)
    dataset_name: "hendrycks/competition_math"
    dataset_split: "train"
    subset_size: null
    prompt_template: |
      Solve the following mathematics problem.
      Put your final answer inside \\boxed{{}}.

      Problem: {problem}

      Solution:

# ── Step 1: Teacher output generation ──────────────────────
generation:
  teacher_base_url: "http://localhost:8000"
  teacher_model: "Qwen/Qwen2.5-14B-Instruct"
  eval_config: "configs/eval.yaml"       # fallback only — benchmarks above take priority
  extra_prompts_file: null               # optional: "configs/prompts.jsonl"
  output_file: "results/distill/teacher_outputs.jsonl"

  # Generation parameters — greedy for hard-label distillation
  max_tokens: 1024
  temperature: 0.0
  top_p: 1.0
  batch_size: 32                         # concurrent requests to teacher
  timeout_seconds: 180
  seed: 42

# ── Step 2: Student LoRA SFT ──────────────────────────────
training:
  # Override --student from CLI; default trains the 7B
  student_model: "Qwen/Qwen2.5-7B-Instruct"
  dataset_path: "results/distill/teacher_outputs.jsonl"
  output_dir: "results/distill"

  # Training hyper-parameters
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4         # effective batch = 16
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_seq_length: 2048
  fp16: false
  bf16: true
  gradient_checkpointing: true
  seed: 42

  # Train / validation split for early stopping
  val_ratio: 0.15                        # 15 % held-out for validation
  early_stopping_patience: 3             # stop after 3 eval steps without improvement
  max_grad_norm: 1.0                    # gradient clipping (stability with higher LR)

  # LoRA (PEFT) settings
  lora:
    r: 64
    lora_alpha: 64
    lora_dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj",
                     "gate_proj", "up_proj", "down_proj"]
    bias: "none"
    task_type: "CAUSAL_LM"

  # Logging & checkpointing
  logging:
    logging_steps: 10
    save_strategy: "steps"
    save_steps: 200
    eval_strategy: "steps"               # evaluate every eval_steps
    eval_steps: 50                       # evaluation frequency
    load_best_model_at_end: true         # restore best checkpoint at end
    report_to: "none"

# ── Per-model training overrides ─────────────────────────
# Keys under each model name override the base 'training' section.
# Nested dicts (e.g. lora) are merged, not replaced.
model_overrides:
  # 7B: prior run regressed GSM8K (85.78 -> 79.83). Strategy — gentler SFT,
  # smaller LoRA capacity, oversample GSM8K TRAIN rows vs MATH to align with teacher style.
  "Qwen/Qwen2.5-7B-Instruct":
    num_train_epochs: 2
    learning_rate: 3.0e-5
    weight_decay: 0.02
    warmup_ratio: 0.08
    max_grad_norm: 1.0
    early_stopping_patience: 5
    oversample_benchmarks:
      gsm8k: 2
      math: 1
    lora:
      r: 48
      lora_alpha: 96
      lora_dropout: 0.08
    logging:
      eval_steps: 35
      save_steps: 105
  # 1.5B student: stronger KD (larger LoRA, longer schedule, oversample train rows)
  # Goal: push GSM8K and MATH vs previous post-KD. +10 pp on both is aspirational;
  # re-tune lr/epochs if loss diverges or val_loss plateaus early.
  "Qwen/Qwen2.5-1.5B-Instruct":
    num_train_epochs: 5
    learning_rate: 2.5e-4
    max_grad_norm: 0.8
    weight_decay: 0.01
    warmup_ratio: 0.10
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    early_stopping_patience: 6
    oversample_benchmarks:
      gsm8k: 2
      math: 2
    lora:
      r: 96
      lora_alpha: 160
      lora_dropout: 0.08
    logging:
      eval_steps: 40
      save_steps: 120
