# ─────────────────────────────────────────────────────────────
# routing_eval_holdout_v2_routing_real.yaml
# ─────────────────────────────────────────────────────────────
# Re-lanzamiento del holdout v2 SOLO con sweep de λ realista.
#
# Motivación:
#   En el barrido anterior {0.010, 0.025, 0.050, 0.100} todos los puntos
#   estaban en la zona saturada del routing: U = Q̂ − λ·Ĉ siempre ganaba
#   el 1.5B (entry_rung=student_small en 600/600 peticiones, en cualquier
#   λ probado). Esto es porque Q̂∈[0,1] mientras Ĉ está en cientos de ms,
#   así que λ ≥ 0.001 ya hace dominar siempre el coste.
#
# La λ crítica para que el 3B gane al 1.5B es ~5e-5 a 5e-4 según prompt.
# Por eso este barrido cubre ese rango y añade dos controles:
#   - λ = 0     → calidad pura (control "routing por calidad")
#   - floor=0.55 → política alternativa min_rung_meeting_floor
#
# Distribución esperada de entry_rung (simulación offline desde
# routing_scores ya guardados de holdout v2; ver analysis/_lambda_sweep_sim.py):
#
#     λ=0       :  1.5B= 87,  3B=238,  7B=275
#     λ=5e-5    :  1.5B=230,  3B=343,  7B= 27
#     λ=1e-4    :  1.5B=292,  3B=307,  7B=  1
#     λ=5e-4    :  1.5B=574,  3B= 26,  7B=  0
#     floor=0.55:  1.5B=280,  3B= 64,  7B= 17  (resto cae a 1.5B + cascada)
#
# Nota: NO se relanzan sysA/sysB (ya tenemos baselines del 20260520) ni sysD
# (cascada pura es ortogonal a este sweep). Solo 5 sysE + 4 sysC opcionales.
#
# Si tienes presupuesto justo: lanzar SOLO los sysE (5 jobs) y dejar sysC para
# después. Es donde está la decisión interesante (routing + cascada).
#
# BSC (réplica no-destilada de sysF; el sysF distilled ya está en 20260525T112354Z):
#   Pre-requisito: los servers 3B / 7B / teacher (student_q3b, student_mid, teacher)
#   siguen vivos.  Solo se reemplaza el server student_small por la versión base.
#
#   Paso 1 — git pull
#     git pull
#
#   Paso 2 — Reemplazar student_small por la versión base (Qwen2.5-1.5B-Instruct).
#     # Identifica el JOBID del server student_small actual (PORT 8200-8299).
#     squeue -u $USER --name=vllm-role-p2 --states=R -h -o '%i %j %B %M'
#     # Cancela ese job (sustituye <JOBID_SMALL>).
#     scancel <JOBID_SMALL>
#     # Limpia el .url por si el trap del job no lo borró.
#     rm -f results/routing/endpoints/student_small.url
#     # Relanza student_small con MODELS_CONFIG=configs/models_no_distill.yaml.
#     sbatch --time=02:30:00 \
#       --export=ALL,ROLE=student_small,PROJECT_DIR="$PWD",MODELS_CONFIG=configs/models_no_distill.yaml \
#       slurm/server_role_phase2.sbatch
#     # Espera publicación.
#     while [ ! -s results/routing/endpoints/student_small.url ]; do sleep 5; done
#     URL=$(cat results/routing/endpoints/student_small.url); echo "$URL"
#     # Sanity: el server debe declarar Qwen/Qwen2.5-1.5B-Instruct.
#     curl -s "$URL/v1/models" | python -c "import sys,json; print([m['id'] for m in json.load(sys.stdin)['data']])"
#     # Debe imprimir: ['Qwen/Qwen2.5-1.5B-Instruct']
#
#   Paso 3 — Lanzar sysF_no_distill (mismos hiperparámetros que sysF, base 1.5B)
#     sbatch --job-name="eval-sysF_no_distill" --time=02:00:00 \
#       --export=ALL,SYSTEM_ID=sysF_no_distill,PROJECT_DIR="$PWD",EVAL_CONFIG=configs/routing_eval_holdout_v2_routing_real.yaml,PROMPT_POOL=results/routing_eval_holdout/prompt_pool.jsonl,ENDPOINT_WAIT_S=900 \
#       slurm/eval_holdout.sbatch
#
#   Validación post-eval:
#     # En logs del cliente, "selected_models[student_small]" debe ser
#     # 'Qwen/Qwen2.5-1.5B-Instruct'.  Se compara contra sysF_smart_cascade
#     # (distilled, holdout 20260525T112354Z).
# ─────────────────────────────────────────────────────────────

common:
  seed: 42
  results_base_dir: "results/routing_eval_holdout_v2_routing_real"

execution_plan:
  one_job_per_system: true
  shared_prompt_pool: "results/routing_eval_holdout/prompt_pool.jsonl"
  endpoint_dir: "results/routing/endpoints"
  endpoint_wait_s: 1200

systems:
  # ── sysE: routing + cascada — sweep λ realista (los 4 puntos cubren regímenes distintos)
  - id: "sysE_l0"
    policy: "routing_plus_cascade"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_plus_cascade:
        cost_weight_lambda: 0.0
        # Sin coste: el router elige el rung con mayor Q̂. Se espera mayoría 7B/3B.

  - id: "sysE_l5e5"
    policy: "routing_plus_cascade"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_plus_cascade:
        cost_weight_lambda: 0.00005

  - id: "sysE_l1e4"
    policy: "routing_plus_cascade"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_plus_cascade:
        cost_weight_lambda: 0.0001

  - id: "sysE_l5e4"
    policy: "routing_plus_cascade"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_plus_cascade:
        cost_weight_lambda: 0.0005

  - id: "sysE_floor55"
    policy: "routing_plus_cascade"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_plus_cascade:
        routing_selection: "min_rung_meeting_floor"
        min_quality_floor: 0.55
        # cost_weight_lambda no se usa en este modo, pero lo dejamos por si
        # algún log lo lee
        cost_weight_lambda: 0.0

  # ── sysF: cascada profunda controlada (las tres palancas: threshold-por-rung
  #          + max_attempts + bypass-parseable). λ=1e-4 como punto operativo
  #          inicial (replica el ganador de sysE).
  #
  # max_attempts=4 mantiene el teacher como red de seguridad, pero NUNCA hay
  # salto directo: la cascada recorre el rung_order en orden y se queda con la
  # última respuesta si ningún rung supera su umbral (reason=cascade_exhausted).
  #
  # post_hoc_threshold_per_rung: rellenar tras correr en BSC
  #   python scripts/calibrate_per_rung_thresholds.py \
  #     --dataset results/predictors_model_tier/datasets/quality_post_hoc_model_tier.jsonl \
  #     --bundle  results/predictors_model_tier/phase_b/refined-qph-rf-20260521T141032Z/model_bundle.joblib \
  #     --criterion cost --fp-cost 1.0 --fn-cost 3.0 \
  #     --out results/predictors_model_tier/phase_b/per_rung_thresholds.yaml \
  #     --report-out results/predictors_model_tier/phase_b/per_rung_thresholds_report.json
  - id: "sysF_smart_cascade"
    policy: "routing_plus_cascade"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_plus_cascade:
        cost_weight_lambda: 0.0001
        max_attempts: 4
        accept_if_parseable: true
        parseable_min_confidence: 0.40
        # Thresholds calibrados con scripts/calibrate_per_rung_thresholds.py
        # (--criterion precision_target --target-precision 0.85 --min-recall 0.30).
        post_hoc_threshold_per_rung:
          student_small: 0.357
          student_q3b:   0.160
          student_mid:   0.139
          teacher:       1.000

  # ── sysF2: igual que sysF pero con thresholds calibrados a precision 0.90
  #          (más estrictos → más calidad esperada) y lambda más alto
  #          (5e-5 → routing entra por rungs más caros, no satura al 1.5B).
  #
  # Los valores post_hoc_threshold_per_rung de abajo son PLACEHOLDERS.
  # En BSC se recalculan con:
  #   python scripts/calibrate_per_rung_thresholds.py \
  #     --dataset results/predictors_model_tier/datasets/quality_post_hoc_model_tier.jsonl \
  #     --bundle  results/predictors_model_tier/phase_b/refined-qph-rf-20260521T141032Z/model_bundle.joblib \
  #     --criterion precision_target --target-precision 0.90 --min-recall 0.20 \
  #     --out results/predictors_model_tier/phase_b/per_rung_thresholds_v2.yaml \
  #     --report-out results/predictors_model_tier/phase_b/per_rung_thresholds_report_v2.json \
  #     --apply-to-config configs/routing_eval_holdout_v2_routing_real.yaml \
  #     --apply-to-system sysF2_smart_cascade
  - id: "sysF2_smart_cascade"
    policy: "routing_plus_cascade"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_plus_cascade:
        cost_weight_lambda: 0.00005
        max_attempts: 4
        accept_if_parseable: true
        parseable_min_confidence: 0.45
        post_hoc_threshold_per_rung:
          student_small: 0.500
          student_q3b:   0.300
          student_mid:   0.250
          teacher:       1.000

  # ── Réplica no-destilada de sysF para aislar el aporte del KD en el 1.5B.
  # MISMOS hiperparámetros que sysF_smart_cascade (λ=1e-4, thresholds calibrados a
  # precision 0.85, max_attempts=4, accept_if_parseable=true, parseable_min_conf=0.40).
  # Único cambio: models_config apunta a models_no_distill.yaml, de modo que el
  # cliente pide Qwen2.5-1.5B-Instruct en lugar del checkpoint distilled.
  #
  # En sysF (distilled) entran 288/600 (48%) prompts por el 1.5B y 147 (24.5%)
  # se resuelven allí: máxima señal para medir Δacc(distill − base) del 1.5B.
  # Se compara directamente con el sysF ya ejecutado el 20260525T112354Z
  # (no relanzamos el distilled, ya tenemos los resultados).
  - id: "sysF_no_distill"
    policy: "routing_plus_cascade"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    models_config: "configs/models_no_distill.yaml"
    policy_overrides:
      routing_plus_cascade:
        cost_weight_lambda: 0.0001
        max_attempts: 4
        accept_if_parseable: true
        parseable_min_confidence: 0.40
        post_hoc_threshold_per_rung:
          student_small: 0.357
          student_q3b:   0.160
          student_mid:   0.139
          teacher:       1.000

  # ── sysG_lite: RouteCascade "lite" — el experimento clave de cierre.
  #
  # La auditoria de sysF2 sobre los 600 prompts del holdout revela que las
  # cascadas profundas (3 y 4 saltos) son el 22% del trafico pero solo
  # recuperan 18 aciertos absolutos (~3% del total). Pagamos el 7B y el 14B
  # en 132 prompts para resolver 18; eso dispara el coste agregado a ~5 PFLOPs
  # y el p95 a ~24 s. La cascada profunda confunde "threshold no superado" con
  # "el problema se va a resolver con mas capacidad", cuando en muchos casos
  # el problema esta fuera del alcance del sistema.
  #
  # Hipotesis: limitando max_attempts=2 conservamos los 305 aciertos de 1
  # intento + 29 de 2 intentos = 334 aciertos (vs 352 de sysF2, 323 de
  # sysC l5e5), eliminando casi todas las llamadas al 7B y 14B. El coste y el
  # p95 deberian acercarse a sysC manteniendo +11 aciertos absolutos.
  - id: "sysG_lite"
    policy: "routing_plus_cascade"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_plus_cascade:
        cost_weight_lambda: 0.00005
        max_attempts: 2
        accept_if_parseable: true
        parseable_min_confidence: 0.45
        post_hoc_threshold_per_rung:
          student_small: 0.500
          student_q3b:   0.300
          student_mid:   0.250
          teacher:       1.000

  # ── sysG_mid: variante intermedia, max_attempts=3 (corta antes del teacher).
  # Mantiene la cascada hasta el 7B pero nunca escala al 14B. Esperado:
  # ~346 aciertos, coste/p95 entre sysG_lite y sysF2.
  - id: "sysG_mid"
    policy: "routing_plus_cascade"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_plus_cascade:
        cost_weight_lambda: 0.00005
        max_attempts: 3
        accept_if_parseable: true
        parseable_min_confidence: 0.45
        post_hoc_threshold_per_rung:
          student_small: 0.500
          student_q3b:   0.300
          student_mid:   0.250
          teacher:       1.000

  # ── sysC: routing puro con la misma rejilla (opcional; lanza si hay tiempo)
  - id: "sysC_l0"
    policy: "routing_predictive"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_predictive:
        cost_weight_lambda: 0.0

  - id: "sysC_l5e5"
    policy: "routing_predictive"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_predictive:
        cost_weight_lambda: 0.00005

  - id: "sysC_l1e4"
    policy: "routing_predictive"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_predictive:
        cost_weight_lambda: 0.0001

  - id: "sysC_l5e4"
    policy: "routing_predictive"
    roles: ["student_small", "student_q3b", "student_mid", "teacher"]
    policy_overrides:
      routing_predictive:
        cost_weight_lambda: 0.0005

benchmarks:
  gsm8k_holdout:
    enabled: true
    benchmark_label: "gsm8k"
    dataset_name: "openai/gsm8k"
    dataset_config: "main"
    dataset_split: "test"
    min_example_id: 250
    subset_size: 300
    prompt_template: |
      Solve the following math problem step by step.
      Put your final numeric answer after ####.

      Question: {question}

      Answer:
    answer_extraction_pattern: "####\\s*([\\-\\d,\\.]+)"

  hendrycks_math_holdout:
    enabled: true
    benchmark_label: "math"
    dataset_name: "EleutherAI/hendrycks_math"
    dataset_subjects:
      - algebra
      - counting_and_probability
      - geometry
      - intermediate_algebra
      - number_theory
      - prealgebra
      - precalculus
    dataset_split: "train"
    subset_size: 300
    prompt_template: |
      Solve the following mathematics problem.
      Put your final answer inside \\boxed{{}}.

      Problem: {problem}

      Solution:
    answer_extraction_pattern: "\\\\boxed\\{([^}]+)\\}"

workload:
  arrival_rates_rps: [5]
  num_warmup_requests: 15
  max_inflight: 48
  shuffle_per_rate: true
  max_tokens: 512
  temperature: 0.0
  request_timeout_s: 180.0
  logprobs_top_k: 5
  stream: false
  samplers:
    server_metrics:
      enabled: true
      interval_s: 0.25
    gpu_smi:
      enabled: true
      interval_s: 0.2

predictors:
  cost_policy: "strict_ex_ante"
  bundles:
    # Predictores reentrenados con model_tier (los del holdout v2 del 20260524).
    quality_ex_ante: "results/predictors_model_tier/phase_b/refined-qea-rf-20260521T140929Z/model_bundle.joblib"
    quality_post_hoc: "results/predictors_model_tier/phase_b/refined-qph-rf-20260521T141032Z/model_bundle.joblib"
    service_cost: "results/predictors_model_tier/phase_a/refined-sc-rf-20260521T140842Z/model_bundle.joblib"
  thresholds:
    quality_ex_ante: 0.6226785631261728
    quality_post_hoc: 0.7727837620033459
  source:
    phase_a_selection: "results/predictors_model_tier/phase_a/REFINEMENT_SELECTION.json"
    phase_b_selection: "results/predictors_model_tier/phase_b/REFINEMENT_SELECTION.json"
    requires_model_tier_feature: true

policy_params:
  routing_predictive:
    routing_selection: max_utility
    min_quality_floor: 0.55
    candidate_rungs: ["student_small", "student_q3b", "student_mid", "teacher"]
    cost_weight_lambda: 0.0001
  cascade_five_rung:
    rung_order: ["student_small", "student_q3b", "student_mid", "teacher"]
    post_hoc_threshold: 0.7727837620033459
    per_rung_timeout_ms: [4000, 6000, 8000, 120000]
  routing_plus_cascade:
    routing_selection: max_utility
    min_quality_floor: 0.55
    routing_candidates: ["student_small", "student_q3b", "student_mid"]
    rung_order: ["student_small", "student_q3b", "student_mid", "teacher"]
    post_hoc_threshold: 0.7727837620033459
    per_rung_timeout_ms: [4000, 6000, 8000, 120000]
    cost_weight_lambda: 0.0001

output:
  per_request_jsonl: "per_request.jsonl"
  summary_json: "summary.json"
