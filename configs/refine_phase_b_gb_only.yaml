# Gradient Boosting only — Phase B (does not overwrite RF in predictors_refined/)
output_root: "results/phase_b/predictors_refined_gb"

primary_metric: "test_roc_auc"
primary_metric_direction: "max"

predictors:
  - id: "quality_ex_ante"
    task: "classification"
    dataset_jsonl: "results/phase_b/datasets/quality_ex_ante_phase_b.jsonl"
    dataset_meta_json: "results/phase_b/datasets/quality_ex_ante_phase_b_meta.json"
    target_column: "target_correct"
    seed: 42
    train_ratio: 0.70
    val_ratio: 0.15
    n_iter: 30
    n_splits: 3
    scoring: "roc_auc"
    families:
      - gradient_boosting
    threshold:
      criterion: "cost"
      fp_cost: 2.0
      fn_cost: 1.0
    search_space:
      gradient_boosting:
        learning_rate: [0.03, 0.05, 0.1]
        max_iter: [200, 400, 800]
        max_depth: [null, 6, 8, 12]
        max_leaf_nodes: [15, 31, 63]
        l2_regularization: [0.0, 1.0e-4, 1.0e-2]

  - id: "quality_post_hoc"
    task: "classification"
    dataset_jsonl: "results/phase_b/datasets/quality_post_hoc_phase_b.jsonl"
    dataset_meta_json: "results/phase_b/datasets/quality_post_hoc_phase_b_meta.json"
    target_column: "target_correct"
    seed: 42
    train_ratio: 0.70
    val_ratio: 0.15
    n_iter: 30
    n_splits: 3
    scoring: "roc_auc"
    families:
      - gradient_boosting
    threshold:
      criterion: "cost"
      fp_cost: 3.0
      fn_cost: 1.0
    search_space:
      gradient_boosting:
        learning_rate: [0.03, 0.05, 0.1]
        max_iter: [200, 400, 800]
        max_depth: [null, 6, 8, 12]
        max_leaf_nodes: [15, 31, 63]
        l2_regularization: [0.0, 1.0e-4, 1.0e-2]
