# Phase A refinement for routing predictors with `model_tier` as a learnt feature.
# Datasets are rebuilt by `slurm/retrain_predictors_model_tier.sbatch`.

output_root: "results/predictors_model_tier/phase_a"

primary_metric: "test_mae"
primary_metric_direction: "min"

predictors:
  - id: "service_cost"
    task: "regression"
    dataset_jsonl: "results/predictors_model_tier/datasets/service_cost_model_tier.jsonl"
    dataset_meta_json: "results/predictors_model_tier/datasets/service_cost_model_tier_meta.json"
    target_column: "target_service_cost"
    seed: 42
    train_ratio: 0.70
    val_ratio: 0.15
    n_iter: 30
    n_splits: 3
    scoring: "neg_mean_absolute_error"
    families:
      - random_forest
      - gradient_boosting
    search_space:
      random_forest:
        n_estimators: [100, 200, 400, 800]
        max_depth: [null, 10, 20, 40]
        min_samples_leaf: [1, 2, 5, 10]
        max_features: ["sqrt", 0.5, 0.8, 1.0]
      gradient_boosting:
        learning_rate: [0.03, 0.05, 0.1]
        max_iter: [200, 400, 800]
        max_depth: [null, 6, 8, 12]
        max_leaf_nodes: [15, 31, 63]
        l2_regularization: [0.0, 1.0e-4, 1.0e-2]
